[project]
name = "sportmarket-analysis"
version = "0.1.0"
description = "Four years of Sportmarket Pro betting history, and the machinery that decides which patterns are real."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "altair>=5.3"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `src/` holds plain modules, not an importable package; the install exists
# only to pull in dependencies. Without this, setuptools auto-discovery sees
# data/, reports/ and notebooks/ as packages and refuses to build.
py-modules = []

[tool.pytest.ini_options]
# Flat src layout: modules import as `from odds import implied_odds`.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "owner: covers a module the repo owner writes by hand; expected to fail until then",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RET", "PD"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
