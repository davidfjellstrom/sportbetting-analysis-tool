[project]
name = "sportmarket-analysis"
version = "0.1.0"
description = "Four years of Sportmarket Pro betting history, and the machinery that decides which patterns are real."
requires-python = ">=3.11"
# What the deployed API needs, and nothing more: Vercel installs exactly this
# list. scipy and statsmodels belong to stats.py, which is not written yet;
# they live in the `stats` extra so the function does not carry them until
# it uses them.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
stats = ["scipy>=1.13", "statsmodels>=0.14"]
app = ["streamlit>=1.36", "altair>=5.3"]
api = ["uvicorn>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `src/` holds flat modules, not a package. Listing them here makes
# `pip install -e .` the one way every consumer — tests, the Streamlit app,
# the API, a notebook — gets `import loader` to work, with no sys.path edits.
package-dir = {"" = "src"}
py-modules = [
    "aggregations",
    "checks",
    "features",
    "loader",
    "odds",
    "stats",
    "validate",
]

# Vercel: one Python function from api/index.py, the frontend built first
# and served from the CDN (FastAPI's app.frontend), never from the function.
[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build"

[tool.vercel.fastapi.static]
exclude = true

[tool.pytest.ini_options]
# Flat src layout: modules import as `from odds import implied_odds`.
# The repo root is on the path so tests can import the `api` package.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "owner: covers a module the repo owner writes by hand; expected to fail until then",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "app", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RET", "PD"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
