[project]
name = "sportmarket-analysis"
version = "0.1.0"
description = "Four years of Sportmarket Pro betting history, and the machinery that decides which patterns are real."
requires-python = ">=3.11"
# What the deployed API needs, and nothing more: Vercel installs exactly this
# list.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.141.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
api = ["uvicorn>=0.30"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `src/` holds flat modules, not a package. Listing them here makes
# `pip install -e .` the one way every consumer — tests, the API, a
# notebook — gets `import loader` to work, with no sys.path edits.
package-dir = {"" = "src"}
py-modules = [
    "aggregations",
    "checks",
    "loader",
]

# Vercel: one Python function from api/index.py, the frontend built first
# and served from the CDN (FastAPI's app.frontend), never from the function.
[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.scripts]
build = "cd frontend && npm ci && npm run build"

[tool.vercel.fastapi.static]
exclude = true

[tool.pytest.ini_options]
# Flat src layout: modules import as `from loader import matched`.
# The repo root is on the path so tests can import the `api` package.
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RET", "PD"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
