name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Owner modules are unimplemented on a fresh clone; keep CI green on the
      # parts that exist. Drop the marker filter once odds/features/stats land.
      - run: pytest -m "not owner"
